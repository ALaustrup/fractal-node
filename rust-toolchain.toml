# Pinned. Bumping this is an ADR-worthy event: it changes the compiler that
# every agent and every CI run uses, and it can silently change lint behaviour.
[toolchain]
channel    = "1.98.1"
components = ["rustfmt", "clippy", "rust-src"]
# N2: cross-platform from day zero. The core compiles to all three from PH0.
targets = [
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
profile = "minimal"
