# cargo-deny: supply chain is part of the security posture (P8).
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive only. A copyleft dependency in a crate we may later ship inside a
# desktop binary or a wasm bundle is a distribution decision, not a build one.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.93
# The allow-list above governs what we are willing to DEPEND on. It should not
# be asked to judge this project's own crates, whose licence is a deliberate
# placeholder (see LICENSE) and is not an SPDX identifier. Applies only because
# every workspace member is `publish = false`; cargo-deny is right to refuse
# this exemption to anything bound for crates.io.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ...but a path dependency inside this workspace is not the thing that ban
# exists to catch. `wildcards = "deny"` is aimed at `serde = "*"` from a
# registry — an unbounded range that lets a future release change underneath
# us. `fractal-ports = { path = "crates/ports" }` resolves to one directory in
# this repository and cannot drift. Denying it would force a version number
# onto every internal crate to satisfy a lint, and that number would go stale
# the first week. Like `private` above, this applies only to unpublishable
# crates.
allow-wildcard-paths = true
# 02 §5: five new third-party runtime dependencies per phase. This is where that
# budget is enforced for anything that would otherwise arrive transitively.
deny = [
  { name = "openssl", reason = "Use rustls. One TLS stack, no system OpenSSL dependency." },
  { name = "openssl-sys", reason = "See openssl." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
